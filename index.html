<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cronograma de Produção — Equipe de Arquitetura</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Jost:wght@500;600&display=swap');
  :root{
    --paper:#F1EEE7; --ink:#1E2A32; --ink-soft:#4B5A63; --line:#C9C2B4;
    --navy:#2B4257; --navy-deep:#1B2E3D; --brick:#A85736; --ok:#3E6B4F;
    --paper-card:#FBFAF6; --disabled:#E4E0D6;
    --font-label:'Jost', 'Inter', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--paper); color:var(--ink); font-family:'Inter', 'Helvetica Neue', Arial, sans-serif; font-size:14px; line-height:1.45; padding:40px 32px 80px;}
  .wrap{max-width:1240px; margin:0 auto;}
  header{display:flex; justify-content:space-between; align-items:flex-end; border-bottom:2px solid var(--navy); padding-bottom:20px; margin-bottom:28px; flex-wrap:wrap; gap:12px;}
  .eyebrow{font-family:var(--font-label); font-weight:600; font-size:11px; letter-spacing:3px; text-transform:uppercase; color:var(--brick); margin:0 0 8px;}
  h1{font-size:30px; margin:0 0 8px; font-weight:800; letter-spacing:-0.3px; color:var(--navy-deep);}
  .subtitle{color:var(--ink-soft); font-size:13.5px; max-width:600px;}
  .meta-box{font-family:var(--font-label); font-weight:500; letter-spacing:0.5px; font-size:11.5px; color:var(--ink-soft); text-align:right;}
  #userBadge{font-size:12px; color:var(--ink-soft); margin-top:4px;}
  #logoutBtn{background:none; border:1px solid var(--line); color:var(--ink-soft); padding:6px 12px; font-size:12px; cursor:pointer; margin-top:6px; border-radius:2px; transition:all .15s ease;}
  #logoutBtn:hover{border-color:var(--brick); color:var(--brick);}

  .auth-box{max-width:380px; margin:80px auto; background:var(--paper-card); border:1px solid var(--line); border-radius:3px; padding:32px; box-shadow:0 12px 32px rgba(30,42,50,0.08);}
  .auth-box h2{margin:0 0 6px; font-size:19px; font-weight:800; letter-spacing:-0.2px; color:var(--navy-deep);}
  .auth-box p.hint{font-size:12.5px; color:var(--ink-soft); margin:0 0 20px;}
  .auth-box label{display:block; font-family:var(--font-label); font-weight:600; font-size:10.5px; text-transform:uppercase; letter-spacing:1.5px; color:var(--ink-soft); margin-bottom:4px; margin-top:14px;}
  .auth-box input{width:100%; padding:10px; border:1px solid var(--line); border-radius:2px; font-size:14px; font-family:'Inter', sans-serif;}
  .auth-box button{width:100%; margin-top:18px; padding:12px; background:var(--brick); color:#fff; border:none; border-radius:2px; font-weight:700; letter-spacing:0.3px; cursor:pointer; font-size:14px; transition:background .15s ease;}
  .auth-box button:hover{background:#8f462b;}
  .auth-box .switch{margin-top:14px; font-size:12.5px; text-align:center; color:var(--ink-soft);}
  .auth-box .switch a{color:var(--navy); cursor:pointer; text-decoration:underline;}
  .auth-error{color:var(--brick); font-size:12.5px; margin-top:10px;}
  .auth-ok{color:var(--ok); font-size:12.5px; margin-top:10px;}

  .controls{display:flex; gap:16px; align-items:flex-end; flex-wrap:wrap; background:var(--paper-card); border:1px solid var(--line); border-radius:3px; padding:18px 20px; margin-bottom:20px; box-shadow:0 4px 14px rgba(30,42,50,0.05);}
  .field label{display:block; font-family:var(--font-label); font-weight:600; font-size:10px; letter-spacing:1.5px; text-transform:uppercase; color:var(--ink-soft); margin-bottom:5px;}
  .field select, .field input{padding:8px; border:1px solid var(--line); border-radius:2px; background:#fff; font-size:13px; font-family:'Inter', sans-serif;}

  nav.tabs{display:flex; gap:2px; margin-bottom:20px;}
  .tab-btn{font-family:var(--font-label); font-weight:600; font-size:12px; letter-spacing:1.5px; text-transform:uppercase; padding:11px 20px; background:var(--paper-card); border:1px solid var(--line); border-bottom:none; border-radius:3px 3px 0 0; cursor:pointer; color:var(--ink-soft); transition:all .15s ease;}
  .tab-btn.active{background:var(--navy); color:var(--paper); border-color:var(--navy);}
  .tab-panel{display:none;}
  .tab-panel.active{display:block;}

  .batch-panel{background:#F7F4EC; border:1px dashed var(--navy); border-radius:3px; padding:18px 20px; margin-bottom:20px;}
  .batch-title{font-family:var(--font-label); font-weight:600; font-size:11px; letter-spacing:1.5px; text-transform:uppercase; color:var(--navy); margin:0 0 12px;}
  .batch-grid{display:flex; gap:10px; align-items:end; flex-wrap:wrap;}
  .batch-grid .field{min-width:110px;}
  .batch-grid input, .batch-grid select{width:100%; padding:8px; border:1px solid var(--line); border-radius:2px; background:#fff; font-size:13px; font-family:'Inter', sans-serif;}
  .batch-hint{font-size:11.5px; color:var(--ink-soft); margin:10px 0 0;}
  .add-btn{background:var(--brick); color:#fff; border:none; border-radius:2px; padding:10px 18px; font-size:13px; font-weight:700; letter-spacing:0.3px; cursor:pointer; transition:background .15s ease;}
  .add-btn:hover{background:#8f462b;}

  nav.month-tabs{display:flex; gap:1px; margin-bottom:16px; flex-wrap:wrap;}
  .month-btn{font-family:var(--font-label); font-weight:600; font-size:11px; letter-spacing:1px; text-transform:uppercase; padding:7px 12px; background:#fff; border:1px solid var(--line); border-radius:2px; cursor:pointer; color:var(--ink-soft); transition:all .15s ease;}
  .month-btn.active{background:var(--brick); color:#fff; border-color:var(--brick);}

  nav.architect-tabs{display:flex; gap:6px; margin-bottom:18px; flex-wrap:wrap;}
  .architect-btn{font-family:var(--font-label); font-weight:600; font-size:12px; letter-spacing:1px; text-transform:uppercase; padding:9px 16px; background:#fff; border:1px solid var(--navy); border-radius:2px; cursor:pointer; color:var(--navy); transition:all .15s ease;}
  .architect-btn.active{background:var(--navy); color:#fff;}
  .ro-cell{color:var(--ink); font-size:12.5px; padding:6px 6px;}
  .ro-cell.ro-empty{color:var(--ink-soft); font-style:italic;}
  .ro-cell.retrabalho-erro{color:var(--brick); font-weight:600;}

  table{width:100%; border-collapse:collapse; font-size:12.5px;}
  thead th{text-align:left; font-family:var(--font-label); font-weight:600; font-size:10px; letter-spacing:1px; text-transform:uppercase; color:var(--ink-soft); border-bottom:2px solid var(--navy); padding:9px 6px;}
  tbody td{padding:5px 6px; border-bottom:1px solid var(--line); vertical-align:top;}
  .day-cell{width:56px; padding-top:9px !important;}
  .day-num{font-family:'Inter', sans-serif; font-weight:800; color:var(--navy-deep); display:block;}
  .dow{font-size:10px; color:var(--ink-soft); font-family:var(--font-label); font-weight:500; letter-spacing:0.5px; text-transform:uppercase; display:block;}
  .day-total{font-size:10.5px; font-family:'Inter', sans-serif; font-weight:600; margin-top:4px; color:var(--ok); display:block;}
  .day-total.over{color:var(--brick); font-weight:700;}
  td input, td select{width:100%; padding:6px 6px; border:1px solid var(--line); border-radius:2px; background:#fff; font-size:12.5px; font-family:'Inter', sans-serif;}
  td input[type="number"]{width:60px;}
  select.retrabalho-erro{color:var(--brick); font-weight:600;}
  select.retrabalho-cliente{color:var(--ink-soft);}
  .icon-btn{background:#fff; border:1px solid var(--line); border-radius:2px; color:var(--ink-soft); cursor:pointer; font-size:13px; width:26px; height:26px; padding:0; transition:all .15s ease;}
  .icon-btn.add-act{color:var(--navy); border-color:var(--navy); font-weight:700;}
  .icon-btn.add-act:hover{background:var(--navy); color:#fff;}
  .icon-btn.del-act:hover{background:var(--brick); color:#fff; border-color:var(--brick);}
  .act-actions{display:flex; gap:4px;}

  .summary-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(300px,1fr)); gap:16px; margin-bottom:24px;}
  .person-card{border:1px solid var(--line); border-radius:3px; background:#fff; padding:20px; box-shadow:0 6px 18px rgba(30,42,50,0.06); transition:box-shadow .2s ease;}
  .person-card:hover{box-shadow:0 10px 26px rgba(30,42,50,0.1);}
  .person-card h3{margin:0 0 14px; font-size:16px; font-weight:800; letter-spacing:-0.2px; color:var(--navy-deep); border-bottom:1px solid var(--line); padding-bottom:10px;}
  .stat-row{display:flex; justify-content:space-between; font-size:12.5px; margin-bottom:6px; color:var(--ink-soft);}
  .stat-row strong{color:var(--ink); font-family:'Inter', sans-serif; font-weight:700;}
  .stat-row.highlight strong{color:var(--brick);}
  .bar-track{height:5px; border-radius:3px; background:var(--paper); margin-top:2px; overflow:hidden;}
  .bar-fill{height:100%; background:var(--brick);}
  .breakdown-title{font-family:var(--font-label); font-weight:600; font-size:10px; letter-spacing:1.5px; text-transform:uppercase; color:var(--ink-soft); margin:16px 0 7px;}
  .breakdown-row{display:flex; justify-content:space-between; font-size:12px; margin-bottom:4px;}
  .breakdown-row span:last-child{font-family:'Inter', sans-serif; font-weight:600; color:var(--ink-soft);}
  .empty-state{padding:40px 20px; text-align:center; color:var(--ink-soft); font-size:13px;}
  .note{font-size:12px; color:var(--ink-soft); border-left:2px solid var(--brick); border-radius:0 2px 2px 0; padding:10px 14px; background:#F7EFE9; margin-top:20px;}
  .loading{padding:60px; text-align:center; color:var(--ink-soft); font-family:var(--font-label); letter-spacing:1px; text-transform:uppercase; font-size:12px;}
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="loading">Carregando…</div>
</div>

<script>
// =====================================================================
// CONFIGURAÇÃO — troque pelos dados do SEU projeto Supabase
// (Painel do Supabase > Project Settings > API)
// =====================================================================
const SUPABASE_URL = 'https://gfvekfxwdvleevksfkky.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_-1vrk4jekR2LYwuQ0xRQVg_i0-7qw9r';
// =====================================================================

function showFatalError(msg){
  document.getElementById('app').innerHTML = `<div class="loading" style="color:var(--brick); max-width:520px; margin:80px auto; text-align:left;">
    <strong>Não foi possível carregar o app.</strong><br><br>${msg}
  </div>`;
}

if(!SUPABASE_URL || SUPABASE_URL.includes('COLOQUE_AQUI') || !SUPABASE_ANON_KEY || SUPABASE_ANON_KEY.includes('COLOQUE_AQUI')){
  showFatalError('As credenciais do Supabase ainda não foram configuradas. Abra o arquivo index.html e substitua SUPABASE_URL e SUPABASE_ANON_KEY, no topo do &lt;script&gt;, pelos valores reais do seu projeto (Project Settings → API no painel do Supabase).');
  throw new Error('Configuração pendente: SUPABASE_URL/SUPABASE_ANON_KEY não foram preenchidos.');
}

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const MONTHS = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const DOW = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const FASES = ['Orçamento','Anteprojeto','Executivo','Apresentação'];
const TIPOS = ['Medição','Paginação','Estrutural','Detalhamento','Correção de projeto'];
const COMPLEX = ['Baixa','Média','Alta'];
const RETRABALHO = ['Nenhum','Erro interno','Mudança do cliente','Falta de informação'];

let currentUser = null;
let currentProfile = null; // {id, nome, papel}
let currentMonth = new Date().getMonth();
let currentYear = new Date().getFullYear();
let localActivities = {}; // key "dia" -> array de atividades (com id do banco)
let currentArchitects = []; // [{id, nome}] — só usado pelo gestor
let selectedArchitectId = null; // arquiteto selecionado na visão do gestor

function fieldOptions(list, selected){
  return list.map(o => `<option value="${o}" ${o===selected?'selected':''}>${o}</option>`).join('');
}
function daysInMonth(year, monthIndex){ return new Date(year, monthIndex+1, 0).getDate(); }
function defaultActivity(){
  return {id:null, projeto:'', fase:FASES[0], tipo:TIPOS[0], complexidade:'Média', m2:'', horas:'', retrabalho:'Nenhum', comentario:''};
}

// ---------- BOOT ----------
async function boot(){
  const { data: { session } } = await sb.auth.getSession();
  if(!session){
    renderAuth();
    return;
  }
  currentUser = session.user;
  const { data: profile, error } = await sb.from('profiles').select('*').eq('id', currentUser.id).single();
  if(error || !profile){
    renderAuth('Não foi possível carregar seu perfil. Tente entrar novamente.');
    return;
  }
  currentProfile = profile;
  renderApp();
}

// ---------- TELA DE LOGIN / CADASTRO ----------
function renderAuth(errorMsg){
  document.getElementById('app').innerHTML = `
    <div class="auth-box">
      <h2 id="authTitle">Entrar</h2>
      <p class="hint">Cronograma de Produção — Equipe de Arquitetura</p>
      <div id="nomeField" style="display:none;">
        <label>Nome</label>
        <input type="text" id="authNome" placeholder="Seu nome">
      </div>
      <label>E-mail</label>
      <input type="email" id="authEmail" placeholder="voce@empresa.com">
      <label>Senha</label>
      <input type="password" id="authSenha" placeholder="••••••••">
      <button id="authSubmitBtn" onclick="submitLogin()">Entrar</button>
      <div class="switch">
        <span id="switchText">Não tem conta? <a onclick="toggleAuthMode()">Criar conta</a></span>
      </div>
      <div id="authMsg"></div>
    </div>
  `;
  if(errorMsg) document.getElementById('authMsg').innerHTML = `<p class="auth-error">${errorMsg}</p>`;
}

let authMode = 'login';
function toggleAuthMode(){
  authMode = authMode === 'login' ? 'signup' : 'login';
  document.getElementById('authTitle').textContent = authMode === 'login' ? 'Entrar' : 'Criar conta';
  document.getElementById('nomeField').style.display = authMode === 'signup' ? 'block' : 'none';
  document.getElementById('authSubmitBtn').textContent = authMode === 'login' ? 'Entrar' : 'Criar conta';
  document.getElementById('switchText').innerHTML = authMode === 'login'
    ? 'Não tem conta? <a onclick="toggleAuthMode()">Criar conta</a>'
    : 'Já tem conta? <a onclick="toggleAuthMode()">Entrar</a>';
  document.getElementById('authMsg').innerHTML = '';
}

async function submitLogin(){
  const email = document.getElementById('authEmail').value.trim();
  const senha = document.getElementById('authSenha').value;
  const msgBox = document.getElementById('authMsg');
  msgBox.innerHTML = '';

  if(!email || !senha){
    msgBox.innerHTML = '<p class="auth-error">Preencha e-mail e senha.</p>';
    return;
  }

  if(authMode === 'signup'){
    const nome = document.getElementById('authNome').value.trim();
    if(!nome){
      msgBox.innerHTML = '<p class="auth-error">Informe seu nome.</p>';
      return;
    }
    const { error } = await sb.auth.signUp({
      email, password: senha, options: { data: { nome } }
    });
    if(error){
      msgBox.innerHTML = `<p class="auth-error">${error.message}</p>`;
      return;
    }
    msgBox.innerHTML = '<p class="auth-ok">Conta criada. Se a confirmação de e-mail estiver ativa no projeto, confirme antes de entrar. Caso contrário, já pode entrar.</p>';
    return;
  }

  const { error } = await sb.auth.signInWithPassword({ email, password: senha });
  if(error){
    msgBox.innerHTML = `<p class="auth-error">${error.message}</p>`;
    return;
  }
  boot();
}

async function logout(){
  await sb.auth.signOut();
  currentUser = null; currentProfile = null;
  renderAuth();
}

// ---------- APP (arquiteto lança os próprios dados; gestor só visualiza por arquiteto) ----------
async function renderApp(){
  const isGestor = currentProfile.papel === 'gestor';

  if(isGestor){
    await loadArchitectsList();
  }

  document.getElementById('app').innerHTML = `
    <header>
      <div>
        <p class="eyebrow">${isGestor ? 'Painel de gestão' : 'Lançamento diário'}</p>
        <h1>Cronograma de Produção</h1>
        <p class="subtitle">${isGestor ? 'Veja os lançamentos de cada arquiteto ou o resumo agregado da equipe. O gestor não lança atividades próprias aqui.' : 'Dias úteis (segunda a sexta). Uma ou mais atividades por dia.'}</p>
      </div>
      <div class="meta-box">
        <div>${currentProfile.nome}</div>
        <div id="userBadge">${isGestor ? 'gestor(a)' : 'arquiteto(a)'}</div>
        <button id="logoutBtn" onclick="logout()">Sair</button>
      </div>
    </header>

    ${isGestor ? `
    <nav class="tabs" id="navTabs">
      <button class="tab-btn active" data-tab="lancamento">Lançamentos por arquiteto</button>
      <button class="tab-btn" data-tab="resumo">Resumo por pessoa</button>
    </nav>` : ''}

    <section class="tab-panel active" id="panel-lancamento">
      <div class="controls">
        <div class="field"><label>Ano</label><input type="number" id="yearInput" value="${currentYear}" style="width:80px;" onchange="onYearChange()"></div>
      </div>

      <nav class="month-tabs" id="monthTabs"></nav>

      ${isGestor ? `
      <nav class="architect-tabs" id="architectTabs"></nav>
      <div class="empty-state" id="emptyStateArchitects" style="display:none;">Nenhum arquiteto cadastrado ainda.</div>
      ` : `
      <div class="batch-panel">
        <p class="batch-title">Preencher mesmo projeto em vários dias</p>
        <div class="batch-grid">
          <div class="field"><label>Projeto</label><input type="text" id="batch-projeto" placeholder="Nome do projeto"></div>
          <div class="field"><label>M²</label><input type="number" id="batch-m2" min="0" step="1" placeholder="0"></div>
          <div class="field"><label>Fase</label><select id="batch-fase">${fieldOptions(FASES, FASES[0])}</select></div>
          <div class="field"><label>Do dia</label><input type="number" id="batch-de" min="1" max="31" placeholder="1"></div>
          <div class="field"><label>Até o dia</label><input type="number" id="batch-ate" min="1" max="31" placeholder="31"></div>
          <button class="add-btn" onclick="applyBatch()">Aplicar ao mês atual</button>
        </div>
        <p class="batch-hint">Preenche Projeto, M² e Fase na primeira atividade de cada dia útil do intervalo. Não sobrescreve uma segunda atividade já lançada no mesmo dia.</p>
      </div>`}

      <table id="dayTable">
        <thead>
          <tr><th>Dia</th><th>Projeto</th><th>Fase</th><th>Tipo de tarefa</th><th>Complex.</th><th>M²</th><th>Horas</th><th>Retrabalho</th><th>Comentários</th>${isGestor ? '' : '<th></th>'}</tr>
        </thead>
        <tbody id="dayTableBody"></tbody>
      </table>
    </section>

    ${isGestor ? `
    <section class="tab-panel" id="panel-resumo">
      <div class="summary-grid" id="summaryGrid"></div>
      <div class="empty-state" id="emptyStateSummary" style="display:none;">Sem dados lançados ainda.</div>
      <div class="note">
        Dia sem lançamento não é necessariamente dia sem trabalho. Retrabalho por erro interno e atividades de alta complexidade importam mais do que volume de horas isolado. M²/hora só serve para comparar a mesma pessoa ao longo do tempo — não para ranquear pessoas em projetos de natureza diferente.
      </div>
    </section>` : ''}
  `;

  if(isGestor){
    document.querySelectorAll('.tab-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
        document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('panel-'+btn.dataset.tab).classList.add('active');
        if(btn.dataset.tab === 'resumo') loadSummary();
      });
    });
  }

  renderMonthTabs();
  if(isGestor){
    renderArchitectTabs();
    document.getElementById('emptyStateArchitects').style.display = currentArchitects.length===0 ? 'block' : 'none';
    document.getElementById('dayTable').style.display = currentArchitects.length===0 ? 'none' : 'table';
  }
  refreshDayView();
}

// ---------- Lista de arquitetos (usada só pelo gestor) ----------
async function loadArchitectsList(){
  const { data, error } = await sb.from('profiles').select('id,nome').eq('papel','arquiteto').order('nome');
  if(error){
    currentArchitects = [];
    return;
  }
  currentArchitects = data || [];
  if(!selectedArchitectId && currentArchitects.length>0){
    selectedArchitectId = currentArchitects[0].id;
  }
}

function renderArchitectTabs(){
  const nav = document.getElementById('architectTabs');
  if(!nav) return;
  nav.innerHTML = '';
  currentArchitects.forEach(arch=>{
    const btn = document.createElement('button');
    btn.className = 'architect-btn' + (arch.id===selectedArchitectId ? ' active':'');
    btn.textContent = arch.nome;
    btn.onclick = ()=>{ selectedArchitectId = arch.id; renderArchitectTabs(); loadArchitectMonthActivities(selectedArchitectId); };
    nav.appendChild(btn);
  });
}

// ---------- Dispatcher: cada papel carrega os dados do jeito certo ----------
function refreshDayView(){
  const isGestor = currentProfile.papel === 'gestor';
  if(isGestor){
    loadArchitectMonthActivities(selectedArchitectId);
  } else {
    loadMonthActivities();
  }
}

function renderMonthTabs(){
  const nav = document.getElementById('monthTabs');
  nav.innerHTML = '';
  MONTHS.forEach((m, idx)=>{
    const btn = document.createElement('button');
    btn.className = 'month-btn' + (idx===currentMonth ? ' active':'');
    btn.textContent = m;
    btn.onclick = ()=>{ currentMonth = idx; renderMonthTabs(); refreshDayView(); };
    nav.appendChild(btn);
  });
}

function onYearChange(){
  currentYear = parseInt(document.getElementById('yearInput').value) || new Date().getFullYear();
  refreshDayView();
}

// ---------- Visão do arquiteto: carrega e edita SÓ os próprios lançamentos ----------
async function loadMonthActivities(){
  const { data, error } = await sb.from('atividades').select('*')
    .eq('ano', currentYear).eq('mes', currentMonth).eq('user_id', currentUser.id);
  if(error){
    alert('Erro ao carregar dados: ' + error.message);
    return;
  }
  localActivities = {};
  (data || []).forEach(row=>{
    if(!localActivities[row.dia]) localActivities[row.dia] = [];
    localActivities[row.dia].push(row);
  });
  renderDayTable();
}

// ---------- Visão do gestor: carrega os lançamentos do arquiteto selecionado, somente leitura ----------
async function loadArchitectMonthActivities(architectId){
  const body = document.getElementById('dayTableBody');
  if(!architectId){
    if(body) body.innerHTML = '';
    return;
  }
  const { data, error } = await sb.from('atividades').select('*')
    .eq('ano', currentYear).eq('mes', currentMonth).eq('user_id', architectId);
  if(error){
    alert('Erro ao carregar dados: ' + error.message);
    return;
  }
  localActivities = {};
  (data || []).forEach(row=>{
    if(!localActivities[row.dia]) localActivities[row.dia] = [];
    localActivities[row.dia].push(row);
  });
  renderDayTableReadOnly();
}

function renderDayTableReadOnly(){
  const body = document.getElementById('dayTableBody');
  const nDays = daysInMonth(currentYear, currentMonth);
  body.innerHTML = '';

  for(let d=1; d<=nDays; d++){
    const dow = new Date(currentYear, currentMonth, d).getDay();
    if(dow===0 || dow===6) continue;

    const acts = (localActivities[d] && localActivities[d].length>0) ? localActivities[d] : null;

    if(!acts){
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td class="day-cell"><span class="day-num">${d}</span><span class="dow">${DOW[dow]}</span></td>
        <td class="ro-cell ro-empty" colspan="8">Sem lançamento</td>
      `;
      body.appendChild(tr);
      continue;
    }

    const totalHoras = acts.reduce((s,a)=>s+(parseFloat(a.horas)||0),0);
    const totalClass = totalHoras > 8 ? 'day-total over' : 'day-total';

    acts.forEach((a, idx)=>{
      const tr = document.createElement('tr');
      let dayCellHtml = '';
      if(idx===0){
        dayCellHtml = `<td class="day-cell" rowspan="${acts.length}">
          <span class="day-num">${d}</span><span class="dow">${DOW[dow]}</span>
          <span class="${totalClass}">${totalHoras}h/dia</span></td>`;
      }
      tr.innerHTML = `
        ${dayCellHtml}
        <td class="ro-cell">${a.projeto || '—'}</td>
        <td class="ro-cell">${a.fase || '—'}</td>
        <td class="ro-cell">${a.tipo || '—'}</td>
        <td class="ro-cell">${a.complexidade || '—'}</td>
        <td class="ro-cell">${a.m2 || '—'}</td>
        <td class="ro-cell">${a.horas || '0'}</td>
        <td class="ro-cell ${a.retrabalho==='Erro interno' ? 'retrabalho-erro' : ''}">${a.retrabalho || '—'}</td>
        <td class="ro-cell">${a.comentario || '—'}</td>
      `;
      body.appendChild(tr);
    });
  }
}

function renderDayTable(){
  const body = document.getElementById('dayTableBody');
  const nDays = daysInMonth(currentYear, currentMonth);
  body.innerHTML = '';

  for(let d=1; d<=nDays; d++){
    const dow = new Date(currentYear, currentMonth, d).getDay();
    if(dow===0 || dow===6) continue;

    let acts = localActivities[d];
    if(!acts || acts.length===0){ acts = [defaultActivity()]; localActivities[d] = acts; }

    const totalHoras = acts.reduce((s,a)=>s+(parseFloat(a.horas)||0),0);
    const totalClass = totalHoras > 8 ? 'day-total over' : 'day-total';

    acts.forEach((a, idx)=>{
      const tr = document.createElement('tr');
      let dayCellHtml = '';
      if(idx===0){
        dayCellHtml = `<td class="day-cell" rowspan="${acts.length}">
          <span class="day-num">${d}</span><span class="dow">${DOW[dow]}</span>
          <span class="${totalClass}">${totalHoras}h/dia</span></td>`;
      }
      const isLast = idx === acts.length - 1;
      const actions = `<div class="act-actions">
          ${isLast ? `<button class="icon-btn add-act" title="Adicionar atividade" onclick="addActivity(${d})">+</button>` : ''}
          ${acts.length>1 ? `<button class="icon-btn del-act" title="Remover" onclick="removeActivity(${d},${idx})">✕</button>` : ''}
        </div>`;
      tr.innerHTML = `
        ${dayCellHtml}
        <td><input type="text" placeholder="—" value="${a.projeto||''}" onchange="updateActivity(${d},${idx},'projeto',this.value)"></td>
        <td><select onchange="updateActivity(${d},${idx},'fase',this.value)">${fieldOptions(FASES, a.fase)}</select></td>
        <td><select onchange="updateActivity(${d},${idx},'tipo',this.value)">${fieldOptions(TIPOS, a.tipo)}</select></td>
        <td><select onchange="updateActivity(${d},${idx},'complexidade',this.value)">${fieldOptions(COMPLEX, a.complexidade)}</select></td>
        <td><input type="number" min="0" step="1" value="${a.m2||''}" onchange="updateActivity(${d},${idx},'m2',this.value)"></td>
        <td><input type="number" min="0" step="0.5" value="${a.horas||''}" onchange="updateActivity(${d},${idx},'horas',this.value)"></td>
        <td><select class="${a.retrabalho==='Erro interno'?'retrabalho-erro':(a.retrabalho==='Mudança do cliente'?'retrabalho-cliente':'')}" onchange="updateActivity(${d},${idx},'retrabalho',this.value)">${fieldOptions(RETRABALHO, a.retrabalho)}</select></td>
        <td><input type="text" placeholder="opcional" value="${a.comentario||''}" onchange="updateActivity(${d},${idx},'comentario',this.value)"></td>
        <td>${actions}</td>
      `;
      body.appendChild(tr);
    });
  }
}

async function updateActivity(dia, idx, field, value){
  const acts = localActivities[dia];
  const act = acts[idx];
  act[field] = value;

  if(act.id){
    const { error } = await sb.from('atividades').update({ [field]: value }).eq('id', act.id);
    if(error) alert('Erro ao salvar: ' + error.message);
  } else {
    if(!act.projeto) return; // não cria linha vazia no banco
    const payload = {
      user_id: currentUser.id, ano: currentYear, mes: currentMonth, dia,
      projeto: act.projeto, fase: act.fase, tipo: act.tipo, complexidade: act.complexidade,
      m2: act.m2 || null, horas: act.horas || 0, retrabalho: act.retrabalho, comentario: act.comentario || null
    };
    const { data, error } = await sb.from('atividades').insert(payload).select().single();
    if(error){ alert('Erro ao salvar: ' + error.message); return; }
    act.id = data.id;
  }
  renderDayTable();
}

function addActivity(dia){
  localActivities[dia].push(defaultActivity());
  renderDayTable();
}

async function removeActivity(dia, idx){
  const act = localActivities[dia][idx];
  if(act.id){
    const { error } = await sb.from('atividades').delete().eq('id', act.id);
    if(error){ alert('Erro ao remover: ' + error.message); return; }
  }
  localActivities[dia].splice(idx, 1);
  if(localActivities[dia].length===0) localActivities[dia].push(defaultActivity());
  renderDayTable();
}

async function applyBatch(){
  const projeto = document.getElementById('batch-projeto').value.trim();
  const m2 = document.getElementById('batch-m2').value;
  const fase = document.getElementById('batch-fase').value;
  const de = parseInt(document.getElementById('batch-de').value) || 1;
  const ate = parseInt(document.getElementById('batch-ate').value) || de;
  if(!projeto){ alert('Informe o projeto.'); return; }

  const nDays = daysInMonth(currentYear, currentMonth);
  for(let d=de; d<=Math.min(ate,nDays); d++){
    const dow = new Date(currentYear, currentMonth, d).getDay();
    if(dow===0 || dow===6) continue;
    if(!localActivities[d] || localActivities[d].length===0) localActivities[d] = [defaultActivity()];
    const act = localActivities[d][0];
    act.projeto = projeto; act.m2 = m2; act.fase = fase;
    if(act.id){
      await sb.from('atividades').update({ projeto, m2: m2||null, fase }).eq('id', act.id);
    } else {
      const payload = { user_id: currentUser.id, ano: currentYear, mes: currentMonth, dia: d,
        projeto, fase, tipo: act.tipo, complexidade: act.complexidade, m2: m2||null, horas: act.horas||0, retrabalho: act.retrabalho };
      const { data, error } = await sb.from('atividades').insert(payload).select().single();
      if(!error) act.id = data.id;
    }
  }
  renderDayTable();
}

// ---------- RESUMO (só carregado quando a aba é aberta, e só existe para gestor) ----------
async function loadSummary(){
  const grid = document.getElementById('summaryGrid');
  grid.innerHTML = '<p style="color:var(--ink-soft); font-size:12.5px;">Carregando…</p>';

  const { data, error } = await sb.from('atividades').select('*, profiles(nome)');
  if(error){
    grid.innerHTML = `<p class="auth-error">Erro ao carregar dados: ${error.message}</p>`;
    return;
  }

  const porPessoa = {};
  const diasPorPessoa = {};
  (data || []).forEach(row=>{
    const nome = row.profiles ? row.profiles.nome : 'Desconhecido';
    if(!porPessoa[nome]) porPessoa[nome] = [];
    porPessoa[nome].push(row);
    if(!diasPorPessoa[nome]) diasPorPessoa[nome] = new Set();
    diasPorPessoa[nome].add(row.ano+'-'+row.mes+'-'+row.dia);
  });

  grid.innerHTML = '';
  if(Object.keys(porPessoa).length===0){
    document.getElementById('emptyStateSummary').style.display='block';
    return;
  }
  document.getElementById('emptyStateSummary').style.display='none';

  const maxHoras = Math.max(...Object.values(porPessoa).map(arr=>arr.reduce((s,a)=>s+(parseFloat(a.horas)||0),0)));

  Object.keys(porPessoa).sort().forEach(nome=>{
    const atividades = porPessoa[nome];
    const totalHoras = atividades.reduce((s,a)=>s+(parseFloat(a.horas)||0),0);
    const totalDias = diasPorPessoa[nome].size;
    const altaComplex = atividades.filter(a=>a.complexidade==='Alta').length;
    const erroInterno = atividades.filter(a=>a.retrabalho==='Erro interno').length;
    const barWidth = maxHoras>0 ? Math.round((totalHoras/maxHoras)*100) : 0;

    const porProjeto = {};
    atividades.forEach(a=>{ porProjeto[a.projeto] = (porProjeto[a.projeto]||0) + (parseFloat(a.horas)||0); });
    const projetoRows = Object.entries(porProjeto).sort((a,b)=>b[1]-a[1])
      .map(([p,h])=>`<div class="breakdown-row"><span>${p}</span><span>${h}h</span></div>`).join('');

    const porTipo = {};
    atividades.forEach(a=>{ porTipo[a.tipo] = (porTipo[a.tipo]||0) + (parseFloat(a.horas)||0); });
    const tipoRows = Object.entries(porTipo).sort((a,b)=>b[1]-a[1])
      .map(([t,h])=>`<div class="breakdown-row"><span>${t}</span><span>${h}h</span></div>`).join('');

    const projetosM2 = {};
    atividades.forEach(a=>{
      const m2v = parseFloat(a.m2)||0;
      if(!projetosM2[a.projeto]) projetosM2[a.projeto] = {m2:0, horas:0};
      if(m2v>0) projetosM2[a.projeto].m2 = m2v;
      projetosM2[a.projeto].horas += (parseFloat(a.horas)||0);
    });
    let m2horaTexto = '—';
    const comM2 = Object.values(projetosM2).filter(p=>p.m2>0 && p.horas>0);
    if(comM2.length>0){
      const somaM2 = comM2.reduce((s,p)=>s+p.m2,0);
      const somaHoras = comM2.reduce((s,p)=>s+p.horas,0);
      m2horaTexto = somaHoras>0 ? (somaM2/somaHoras).toFixed(1)+' m²/h' : '—';
    }

    const card = document.createElement('div');
    card.className='person-card';
    card.innerHTML = `
      <h3>${nome}</h3>
      <div class="stat-row"><span>Dias com registro</span><strong>${totalDias}</strong></div>
      <div class="stat-row"><span>Horas totais</span><strong>${totalHoras}h</strong></div>
      <div class="bar-track"><div class="bar-fill" style="width:${barWidth}%"></div></div>
      <div class="stat-row" style="margin-top:10px;"><span>Atividades de alta complexidade</span><strong>${altaComplex}</strong></div>
      <div class="stat-row ${erroInterno>0 ? 'highlight':''}"><span>Retrabalho por erro interno</span><strong>${erroInterno}</strong></div>
      <div class="stat-row" style="margin-top:10px;"><span>M²/hora (por projeto)</span><strong>${m2horaTexto}</strong></div>
      <p class="breakdown-title">Horas por projeto</p>${projetoRows}
      <p class="breakdown-title">Horas por tipo de tarefa</p>${tipoRows}
    `;
    grid.appendChild(card);
  });
}

boot().catch(e => showFatalError('Erro inesperado: ' + e.message + '<br><br>Abra o Console do navegador (F12) para ver o detalhe técnico completo.'));
